<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Signing in…</title>
</head>
<body>
<script src="js/oidc-client.min.js"></script>
<script>
(function () {
    var mgr = new Oidc.UserManager({
        userStore: new Oidc.WebStorageStateStore({ store: window.localStorage })
    });

    mgr.signinRedirectCallback()
        .then(function () {
            window.location.replace("./");
        })
        .catch(function (err) {
            console.error(err);
            var detail = err && err.error ? err.error : err && err.message ? err.message : String(err);
            if (detail === "login_required") {
                Object.keys(window.localStorage).forEach(function (key) {
                    if (key.indexOf("oidc.") === 0) {
                        window.localStorage.removeItem(key);
                    }
                });
            }
            document.body.textContent =
                "Sign-in failed (" + detail + "). Return to the app and try again.";
        });
})();
</script>
</body>
</html>
